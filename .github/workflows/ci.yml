name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, lint, test, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install CI tools
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-nextest@0.9.140,cargo-deny@0.20.2,cargo-llvm-cov@0.8.7,typos-cli@1.48.0
          fallback: none

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          install -m 0755 "${RUNNER_TEMP}/actionlint" "${HOME}/.cargo/bin/actionlint"

      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "${archive}"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check
          tar -xJf "${archive}" -C "${RUNNER_TEMP}"
          install -m 0755 \
            "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            "${HOME}/.cargo/bin/shellcheck"

      - name: Check spelling
        run: typos

      - name: Lint GitHub Actions
        run: actionlint

      - name: Lint shell scripts
        run: shellcheck scripts/*

      - name: Verify committed dependency resolution
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo nextest run --locked --workspace --all-targets --all-features --profile ci

      - name: Test documentation
        run: cargo test --locked --doc --workspace --all-features

      - name: Check line coverage
        run: cargo llvm-cov --locked --workspace --all-features --summary-only --fail-under-lines 75

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Check Raspberry Pi target
        run: cargo check --locked --workspace --all-targets --target aarch64-unknown-linux-gnu

      - name: Check portable core without an operating system
        run: cargo check --locked -p paper-display -p paper-it8951 -p paper-layout --target thumbv7em-none-eabihf

      - name: Check risk-critical crate coverage
        run: |
          cargo llvm-cov --locked -p paper-layout --all-features --summary-only --fail-under-lines 75
          cargo llvm-cov --locked -p paper-runtime --all-features --summary-only --fail-under-lines 75
          cargo llvm-cov --locked -p paper-simulator --all-features --summary-only --fail-under-lines 75
          cargo llvm-cov --locked -p paper-it8951 --all-features --summary-only --fail-under-lines 75
          cargo llvm-cov --locked -p paper-it8951-linux --all-features --summary-only --fail-under-lines 75

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check
