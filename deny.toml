[graph]
all-features = true

[advisories]
yanked = "deny"
# cosmic-text 0.19 -> fontdb 0.23 still uses ttf-parser. This advisory is an
# unmaintained notice, not a vulnerability; remove the exception when fontdb
# completes its skrifa migration.
ignore = ["RUSTSEC-2026-0192"]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# Path-only workspace dependencies have no registry version and cargo-deny
# classifies them as wildcards. Registry dependencies remain pinned in the root
# workspace table and Cargo.lock.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
