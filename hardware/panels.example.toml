# Copy to panels.local.toml. The local file is ignored by Git.

[[panel]]
name = "desk-6in-hd"
controller = "it8951"
width = 1448
height = 1072
# Clockwise mounting rotation from logical application coordinates to the
# controller's native buffer. This fixture is normally mounted in portrait.
rotation_degrees = 90

# Positive magnitude of the negative VCOM printed on this exact panel's FPC.
vcom_mv = 0 # deliberately invalid until replaced

# First run `probe` without these fields. Then copy its exact identity output
# here before `calibrate`; refresh commands reject unpinned controller identity.
# expected_firmware = "..."
# expected_lut = "M641"

spi_device = "/dev/spidev0.0"
gpio_chip = "/dev/gpiochip0"
cs_line = 8
reset_line = 17
ready_line = 24
# Start at 1 MHz. Profiles reject values above the audited 12.5 MHz vendor rate.
max_spi_hz = 1_000_000

# Every wait is bounded. Start conservatively and record any measured changes.
ready_timeout_ms = 1_000
ready_poll_us = 100
reset_high_ms = 200
reset_low_ms = 10
reset_recovery_ms = 200
display_timeout_ms = 30_000
display_poll_ms = 50
